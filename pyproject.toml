    { name = "hammad177", email = "hammad.shaukat2016@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "langgraph>=1.2.11",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "pydantic-ai>=2.29.0",
    "qdrant-client>=1.12.0",
    "neo4j>=6.2.0",
    "fastembed>=0.8.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "duckduckgo-search>=8.1.1",
    "langchain-community>=0.4.2",
    "ddgs>=9.16.0",
